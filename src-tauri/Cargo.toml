[package]
name = "diaspro-markdown"
version = "0.4.0"
description = "Editor Markdown desktop leggero in stile Diaspro"
authors = ["Diaspro"]
edition = "2024"

[lib]
name = "diaspro_markdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
pulldown-cmark = "0.13"
ammonia = "4"
