name: Cleanup merged branches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-merged-branches.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove verified fully merged branch only
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'fix-mobile-launcher-icon';
            const main = (await github.rest.repos.get({owner,repo})).data;
            if (main.default_branch !== 'main' || main.archived) {
              core.setFailed('Unexpected default branch or archived repository'); return;
            }
            try {
              const b = (await github.rest.repos.getBranch({owner,repo,branch})).data;
              const diff = (await github.rest.repos.compareCommits({owner,repo,base:'main',head:branch})).data;
              const pulls = await github.rest.pulls.list({owner,repo,state:'open',head:owner+':'+branch});
              if (b.protected || diff.ahead_by !== 0 || pulls.data.length) {
                core.warning('Branch retained: protected or has unmerged work/open PR');
                return;
              }
              await github.rest.git.deleteRef({owner,repo,ref:'heads/'+branch});
              core.info('Deleted fully merged branch: '+branch);
              await core.summary.addRaw('Deleted fully merged branch: '+branch).write();
            } catch(e) {
              if (e.status === 404) { core.info('Branch already absent'); return; }
              throw e;
            }
