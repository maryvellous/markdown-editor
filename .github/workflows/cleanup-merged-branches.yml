name: Cleanup already-merged PR branches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-merged-branches.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prune only merged PR branches with unchanged original heads
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const candidates = [{"branch":"desktop-0.4.0-mermaid-undo-icon","pr":9},{"branch":"mobile-mermaid-viewer-icon-sync","pr":8},{"branch":"mobile-1.1.0-features","pr":7},{"branch":"mobile-final-release","pr":6},{"branch":"ui/custom-titlebar-0.3.1","pr":5},{"branch":"ui/separate-recents-guide","pr":4},{"branch":"release/0.2.1-contrast","pr":3},{"branch":"feature/quick-guide-recents","pr":2},{"branch":"build/initial-markdown-editor","pr":1}];
            const deleted = [];
            const skipped = [];
            const metadata = (await github.rest.repos.get({owner,repo})).data;
            if (metadata.default_branch !== 'main' || metadata.archived) {
              core.setFailed('Wrong default branch or archived repository');
              return;
            }
            for (const {branch,pr} of candidates) {
              try {
                const b = (await github.rest.repos.getBranch({owner,repo,branch})).data;
                if (b.protected) { skipped.push(branch + ': protected'); continue; }
                const p = (await github.rest.pulls.get({owner,repo,pull_number:pr})).data;
                if (!p.merged_at || p.base.ref !== 'main' || p.head.ref !== branch || p.head.sha !== b.commit.sha) {
                  skipped.push(branch + ': PR not merged to main or branch changed since merge');
                  continue;
                }
                const open = await github.rest.pulls.list({owner,repo,state:'open',head:owner + ':' + branch});
                if (open.data.length) { skipped.push(branch + ': has open PR'); continue; }
                await github.rest.git.deleteRef({owner,repo,ref:'heads/' + branch});
                deleted.push(branch);
              } catch (e) {
                if (e.status === 404) { skipped.push(branch + ': not found'); continue; }
                throw e;
              }
            }
            await core.summary.addHeading('Merged-PR branch cleanup')
              .addRaw('Deleted: ' + (deleted.join(', ') || 'none') + '\n\n')
              .addRaw('Skipped: ' + (skipped.join(', ') || 'none') + '\n')
              .write();
            core.info(JSON.stringify({deleted,skipped}));
