name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['mobile-v*']
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile-android.yml"
  workflow_dispatch:
    inputs:
      sign_candidate:
        description: 'Sign a test candidate with the approved release key (main only; no publication)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      apk: ${{ steps.meta.outputs.apk }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17.0.21+9"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Read mobile version
        id: meta
        shell: bash
        run: |
          raw_version="$(awk '/^version:/ {print $2; exit}' mobile/pubspec.yaml)"
          if [[ ! "$raw_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[1-9][0-9]*$ ]]; then echo "Invalid Android version/build number" >&2; exit 1; fi
          version="${raw_version%%+*}"
          echo "build=${raw_version##*+}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=mobile-v$version" >> "$GITHUB_OUTPUT"
          echo "apk=diaspro-markdown-mobile-$version.apk" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "mobile-v$version" ]]; then
            echo "Tag and mobile version differ" >&2
            exit 1
          fi

      - name: Reject signed candidate outside main
        if: github.event_name == 'workflow_dispatch' && inputs.sign_candidate && github.ref != 'refs/heads/main'
        run: exit 1

      - name: Bootstrap Android project
        run: bash ./mobile/tool/bootstrap-android.sh

      - name: Resolve packages
        working-directory: .mobile-build
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        working-directory: .mobile-build
        run: flutter analyze --no-pub

      - name: Run Flutter regression tests
        working-directory: .mobile-build
        run: flutter test --no-pub

      - name: Build release APK
        working-directory: .mobile-build
        run: flutter build apk --release --no-pub

      - name: Verify committed mobile lockfile is unchanged
        run: cmp mobile/pubspec.lock .mobile-build/pubspec.lock

      - name: Stage release files
        shell: bash
        run: |
          cp .mobile-build/build/app/outputs/flutter-apk/app-release.apk "${{ steps.meta.outputs.apk }}"

      - name: Sign approved candidates and verify APK identity
        env:
          SIGN_RELEASE_APK: ${{ (startsWith(github.ref, 'refs/tags/mobile-v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign_candidate)) }}
          ANDROID_RELEASE_KEYSTORE_B64: ${{ (startsWith(github.ref, 'refs/tags/mobile-v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign_candidate)) && secrets.ANDROID_RELEASE_KEYSTORE_B64 || '' }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ (startsWith(github.ref, 'refs/tags/mobile-v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign_candidate)) && secrets.ANDROID_RELEASE_STORE_PASSWORD || '' }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ (startsWith(github.ref, 'refs/tags/mobile-v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign_candidate)) && secrets.ANDROID_RELEASE_KEY_PASSWORD || '' }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ (startsWith(github.ref, 'refs/tags/mobile-v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign_candidate)) && secrets.ANDROID_RELEASE_KEY_ALIAS || '' }}
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: bash mobile/tool/verify-release-apk.sh "${{ steps.meta.outputs.apk }}" "${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.build }}"

      - name: Exercise signing with a disposable test key
        if: github.event_name == 'pull_request'
        run: bash mobile/tool/test-release-signing.sh "${{ steps.meta.outputs.apk }}" "${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.build }}"

      - name: Inspect previously published APK certificate
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          gh release download mobile-v1.1.1 --pattern diaspro-markdown-mobile-1.1.1.apk --dir "$work"
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "Previously published APK signing certificate:"
          "$tools/apksigner" verify --verbose --print-certs "$work/diaspro-markdown-mobile-1.1.1.apk"

      - name: Write APK checksum
        run: sha256sum "${{ steps.meta.outputs.apk }}" > "${{ steps.meta.outputs.apk }}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diaspro-markdown-mobile-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.meta.outputs.apk }}
            ${{ steps.meta.outputs.apk }}.sha256
          if-no-files-found: error

  publish-android:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mobile-v')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: diaspro-markdown-mobile-${{ needs.build-android.outputs.version }}
      - name: Publish mobile release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-android.outputs.tag }}
          APK: ${{ needs.build-android.outputs.apk }}
          VERSION: ${{ needs.build-android.outputs.version }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          sha256sum -c "$APK.sha256"
          gh release create "$TAG" \
            "$APK" \
            "$APK.sha256" \
            --verify-tag \
            --title "Diaspro Markdown Mobile $VERSION" \
            --generate-notes
