name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['mobile-v*']
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      apk: ${{ steps.meta.outputs.apk }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Read mobile version
        id: meta
        shell: bash
        run: |
          raw_version="$(awk '/^version:/ {print $2; exit}' mobile/pubspec.yaml)"
          version="${raw_version%%+*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=mobile-v$version" >> "$GITHUB_OUTPUT"
          echo "apk=diaspro-markdown-mobile-$version.apk" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "mobile-v$version" ]]; then
            echo "Tag and mobile version differ" >&2
            exit 1
          fi

      - name: Bootstrap Android project
        run: bash ./mobile/tool/bootstrap-android.sh

      - name: Resolve packages
        working-directory: .mobile-build
        run: flutter pub get

      - name: Analyze
        working-directory: .mobile-build
        run: flutter analyze

      - name: Run Flutter regression tests
        working-directory: .mobile-build
        run: flutter test

      - name: Build release APK
        working-directory: .mobile-build
        run: flutter build apk --release

      - name: Stage release files
        shell: bash
        run: |
          cp .mobile-build/build/app/outputs/flutter-apk/app-release.apk "${{ steps.meta.outputs.apk }}"
          sha256sum "${{ steps.meta.outputs.apk }}" > "${{ steps.meta.outputs.apk }}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: diaspro-markdown-mobile-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.meta.outputs.apk }}
            ${{ steps.meta.outputs.apk }}.sha256
          if-no-files-found: error

  publish-android:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mobile-v')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: diaspro-markdown-mobile-${{ needs.build-android.outputs.version }}
      - name: Publish mobile release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-android.outputs.tag }}
          APK: ${{ needs.build-android.outputs.apk }}
          VERSION: ${{ needs.build-android.outputs.version }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          sha256sum -c "$APK.sha256"
          gh release create "$TAG" \
            "$APK" \
            "$APK.sha256" \
            --verify-tag \
            --title "Diaspro Markdown Mobile $VERSION" \
            --notes "Release Android stabile di Diaspro Markdown. Include editor e anteprima Markdown, apertura/salvataggio tramite Storage Access Framework, Recenti, guida rapida, layout tablet e icona launcher Diaspro (adaptive/themed sui dispositivi compatibili)."
