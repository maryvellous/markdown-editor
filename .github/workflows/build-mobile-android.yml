name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Bootstrap Android project
        run: bash ./mobile/tool/bootstrap-android.sh

      - name: Resolve packages
        working-directory: .mobile-build
        run: flutter pub get

      - name: Analyze
        working-directory: .mobile-build
        run: flutter analyze

      - name: Build release APK
        working-directory: .mobile-build
        run: flutter build apk --release

      - name: Stage APK
        run: cp .mobile-build/build/app/outputs/flutter-apk/app-release.apk diaspro-markdown-mobile.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: diaspro-markdown-mobile-apk
          path: diaspro-markdown-mobile.apk
          if-no-files-found: error

      - name: Publish mobile release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mobile-v0.1.0 --cleanup-tag -y || true
          gh release create mobile-v0.1.0 \
            diaspro-markdown-mobile.apk \
            --target "$GITHUB_SHA" \
            --title "Diaspro Markdown Mobile 0.1.0" \
            --notes "Prima build Android Flutter/Dart di Diaspro Markdown."