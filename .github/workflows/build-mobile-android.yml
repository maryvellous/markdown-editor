name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Read mobile version
        id: meta
        shell: bash
        run: |
          raw_version="$(awk '/^version:/ {print $2; exit}' mobile/pubspec.yaml)"
          version="${raw_version%%+*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=mobile-v$version" >> "$GITHUB_OUTPUT"
          echo "apk=diaspro-markdown-mobile-$version.apk" >> "$GITHUB_OUTPUT"

      - name: Bootstrap Android project
        run: bash ./mobile/tool/bootstrap-android.sh

      - name: Resolve packages
        working-directory: .mobile-build
        run: flutter pub get

      - name: Analyze
        working-directory: .mobile-build
        run: flutter analyze

      - name: Build release APK
        working-directory: .mobile-build
        run: flutter build apk --release

      - name: Stage release files
        shell: bash
        run: |
          cp .mobile-build/build/app/outputs/flutter-apk/app-release.apk "${{ steps.meta.outputs.apk }}"
          sha256sum "${{ steps.meta.outputs.apk }}" > "${{ steps.meta.outputs.apk }}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: diaspro-markdown-mobile-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.meta.outputs.apk }}
            ${{ steps.meta.outputs.apk }}.sha256
          if-no-files-found: error

      - name: Publish mobile release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          APK: ${{ steps.meta.outputs.apk }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" \
            "$APK" \
            "$APK.sha256" \
            --target "$GITHUB_SHA" \
            --title "Diaspro Markdown Mobile $VERSION" \
            --notes "Release Android stabile di Diaspro Markdown. Include editor e anteprima Markdown, apertura/salvataggio tramite Storage Access Framework, Recenti, guida rapida, layout tablet e icona launcher Diaspro (adaptive/themed sui dispositivi compatibili)."
