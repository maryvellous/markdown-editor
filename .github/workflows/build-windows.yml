name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Markdown Editor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read version
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Parse owner-local signing helper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "mobile/tool/setup-release-signing.ps1").Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; throw "Signing helper syntax errors" }

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Verify version consistency
        run: node tools/check-desktop-version.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action
        with:
          toolchain: '1.100.0'

      - name: Cache Rust
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend tooling
        run: npm ci

      - name: Check frontend syntax
        run: node --check src/app.js

      - name: Run desktop document regression tests
        run: node --test tests/document-format.test.mjs tests/desktop-modules.test.mjs

      - name: Verify local Mermaid runtime
        shell: pwsh
        run: |
          if (-not (Test-Path "src\vendor\mermaid.min.js")) { throw "Mermaid runtime non generato" }
          $bundle = Get-Item "src\vendor\mermaid.min.js"
          if ($bundle.Length -lt 100000) { throw "Mermaid runtime troppo piccolo: $($bundle.Length) byte" }

      - name: Generate app icons
        run: npm run icons

      - name: Run Rust rendering tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build raw Windows executable
        run: npm run tauri -- build --no-bundle -- --locked

      - name: Verify committed desktop lockfiles are unchanged
        shell: pwsh
        run: |
          git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw "Dependency locks changed during build" }

      - name: Prepare Diaspro Installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ".release-payload" | Out-Null
          Copy-Item "src-tauri\target\release\diaspro-markdown.exe" ".release-payload\Diaspro Markdown.exe"
          Get-Item ".release-payload\Diaspro Markdown.exe" | Format-List Name,Length,FullName

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.1.0-x64.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile $installer
          $actualHash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          $expectedHash = "0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f"
          if ($actualHash -ne $expectedHash) { throw "Inno Setup SHA256 mismatch: $actualHash" }
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installer exited with code $($process.ExitCode)" }

      - name: Build Diaspro installer
        shell: pwsh
        run: .\.diaspro-installer\build.ps1 -ConfigPath ".\diaspro-installer.json" -Version "${{ steps.meta.outputs.version }}"

      - name: Verify generated installer
        shell: pwsh
        run: |
          $setup = Get-Item ".\dist-installer\Diaspro-Markdown-${{ steps.meta.outputs.version }}-Setup.exe"
          if ($setup.Length -lt 100000) { throw "Installer troppo piccolo: $($setup.Length) byte" }
          Write-Host "Diaspro Markdown installer: $($setup.FullName) - $($setup.Length) byte"

      - name: Smoke test clean install and uninstall
        shell: pwsh
        run: ./tools/smoke-windows-installer.ps1 -SetupPath "dist-installer/Diaspro-Markdown-${{ steps.meta.outputs.version }}-Setup.exe" -PayloadPath ".release-payload/Diaspro Markdown.exe"

      - name: Write installer checksum
        shell: pwsh
        run: |
          $asset = Get-Item ".\dist-installer\Diaspro-Markdown-${{ steps.meta.outputs.version }}-Setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $asset.FullName).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$($asset.FullName).sha256", "$hash  $($asset.Name)`n", [System.Text.Encoding]::ASCII)

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diaspro-markdown-windows
          path: |
            dist-installer/Diaspro-Markdown-${{ steps.meta.outputs.version }}-Setup.exe
            dist-installer/Diaspro-Markdown-${{ steps.meta.outputs.version }}-Setup.exe.sha256
          if-no-files-found: error

  publish-windows:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: diaspro-markdown-windows
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build-windows.outputs.version }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          asset="Diaspro-Markdown-$VERSION-Setup.exe"
          sha256sum -c "$asset.sha256"
          gh release create "$TAG" "$asset" "$asset.sha256" --verify-tag \
            --title "Diaspro Markdown $VERSION" --generate-notes --latest
