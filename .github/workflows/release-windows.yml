name: Release Windows

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend tooling
        run: npm install

      - name: Check frontend syntax
        run: node --check src/app.js

      - name: Generate app icons
        run: npm run icons

      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $version = "${{ steps.meta.outputs.version }}"
          $tag = "${{ steps.meta.outputs.tag }}"
          $asset = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1

          if (-not $asset) {
            throw "Installer NSIS non trovato."
          }

          $notes = @"
          ## Diaspro Markdown $version

          - titlebar Windows personalizzata in stile Diaspro;
          - controlli minimizza, massimizza e chiudi integrati nella UI;
          - doppio clic sulla barra per massimizzare o ripristinare;
          - la chiusura dalla titlebar rispetta le modifiche non salvate.
          "@

          $null = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset.FullName --clobber
          } else {
            gh release create $tag $asset.FullName --target $env:GITHUB_SHA --title "Diaspro Markdown $version" --notes $notes --latest
          }
