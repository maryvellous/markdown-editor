name: Release Windows

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Markdown Editor
        uses: actions/checkout@v7

      - name: Read version
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend tooling
        run: npm install

      - name: Check frontend syntax
        run: node --check src/app.js

      - name: Generate app icons
        run: npm run icons

      - name: Build raw Windows executable
        run: npm run tauri -- build --no-bundle

      - name: Prepare Diaspro Installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ".release-payload" | Out-Null
          Copy-Item "src-tauri\target\release\diaspro-markdown.exe" ".release-payload\Diaspro Markdown.exe"

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.1.0-x64.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile $installer
          $actualHash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          $expectedHash = "0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f"
          if ($actualHash -ne $expectedHash) { throw "Inno Setup SHA256 mismatch: $actualHash" }
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installer exited with code $($process.ExitCode)" }

      - name: Build Diaspro installer
        shell: pwsh
        run: .\.diaspro-installer\build.ps1 -ConfigPath ".\diaspro-installer.json" -Version "${{ steps.meta.outputs.version }}"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $version = "${{ steps.meta.outputs.version }}"
          $tag = "${{ steps.meta.outputs.tag }}"
          $asset = Get-Item ".\dist-installer\Diaspro-Markdown-$version-Setup.exe"

          $notes = @"
          ## Diaspro Markdown $version

          Installer Windows generato con Diaspro Installer.

          - interfaccia di installazione coerente con il brand Diaspro;
          - installazione per l'utente corrente;
          - collegamenti Start e Desktop;
          - associazioni .md e .markdown mantenute.
          "@

          $null = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset.FullName --clobber
          } else {
            gh release create $tag $asset.FullName --target $env:GITHUB_SHA --title "Diaspro Markdown $version" --notes $notes --latest
          }
